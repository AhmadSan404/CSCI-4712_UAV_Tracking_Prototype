[project]
name = "drone-car-tracker"
version = "0.1.0"
description = "Real-time car detection and tracking for drone footage using a small local YOLO model."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.4",
    "torch>=2.9",
    "torchvision>=0.24",
    "lap>=0.5.12",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "cv2-enumerate-cameras>=1.4.0",
]

# PyTorch on PyPI is CPU-only for Windows, so pull CUDA builds from the PyTorch index.
# cu130 wheels support RTX 50-series (Blackwell) GPUs and need an NVIDIA driver >= 580.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
